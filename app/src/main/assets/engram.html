t;}\nhtml,body{height:100%;}\nbody{\n  background:\n    radial-gradient(120% 60% at 85% -10%, rgba(10,122,255,0.07), transparent 60%),\n    radial-gradient(100% 50% at 0% 100%, rgba(10,122,255,0.045), transparent 55%),\n    var(--bg);\n  background-attachment:fixed;\n  color:var(--text);\n  font-family:'Inter',-apple-system,system-ui,sans-serif;\n  font-size:16px;line-height:1.5;\n  font-feature-settings:'tnum' 1,'cv01' 1,'cv03' 1;\n  -webkit-font-smoothing:antialiased;\n  overflow-x:hidden;\n  padding-top:env(safe-area-inset-top);\n}\n.tnum{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;}\ninput,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}\nbutton{cursor:pointer;border:none;background:none;}\n::-webkit-scrollbar{width:0;height:0;}\n\n/* ── Top bar ── */\n.topbar{\n  position:sticky;top:10px;z-index:40;\n  display:flex;align-items:center;justify-content:space-between;\n  margin:10px 14px 2px;\n  padding:12px 20px;\n  background:var(--glass);\n  backdrop-filter:saturate(180%) blur(28px);\n  -webkit-backdrop-filter:saturate(180%) blur(28px);\n  border-radius:24px;\n  box-shadow:var(--glass-edge), 0 6px 24px rgba(20,25,45,0.08);\n}\n.brand{display:flex;align-items:baseline;gap:9px;}\n.brand h1{font-size:22px;font-weight:700;letter-spacing:-0.5px;}\n.brand .tag{font-size:11px;font-weight:600;color:var(--accent);letter-spacing:1.4px;text-transform:uppercase;background:var(--accent-dim);padding:3px 9px;border-radius:99px;transform:translateY(-1px);}\n.gear{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.7);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.6),0 1px 4px rgba(20,25,45,0.08);display:flex;align-items:center;justify-content:center;color:var(--text-mid);transition:background .2s,transform .1s;}\n.gear:active{transform:scale(0.92);background:var(--surface-3);}\n\n/* ── Layout ── */\n.screen{\n  display:none;\n  padding:10px 18px calc(var(--nav-h) + 52px + env(safe-area-inset-bottom));\n  animation:fadeUp .32s cubic-bezier(.22,1,.36,1);\n}\n.screen.active{display:block;}\n@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}\n\n.group-label{\n  font-size:12.5px;font-weight:600;letter-spacing:0.7px;text-transform:uppercase;\n  color:var(--text-mid);padding:28px 8px 10px;\n}\n.card{\n  background:var(--surface);\n  border-radius:var(--radius);\n  padding:20px;\n  margin-bottom:14px;\n  box-shadow:var(--card-shadow);\n}\n.card.tight{padding:16px 20px;}\n\n/* ── Stat grid ── */\n.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px;}\n.stat{\n  background:var(--surface);border-radius:var(--radius);\n  padding:20px 20px 18px;position:relative;overflow:hidden;\n  box-shadow:var(--card-shadow);\n}\n.stat .v{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1;}\n.stat .l{font-size:12.5px;color:var(--text-mid);margin-top:9px;font-weight:500;}\n.stat .u{font-size:14px;color:var(--text-dim);font-weight:600;margin-left:2px;}\n.c-accent{color:var(--accent);}.c-green{color:var(--green);}.c-red{color:var(--red);}.c-yellow{color:#d9a400;}.c-mid{color:var(--text-mid);}\n\n/* ── Buttons ── */\n.btn{\n  display:flex;align-items:center;justify-content:center;gap:8px;\n  width:100%;padding:16px;border-radius:18px;\n  font-weight:600;font-size:16px;letter-spacing:-0.2px;\n  transition:transform .1s,filter .2s;\n}\n.btn:active{transform:scale(0.975);}\n.btn-primary{background:linear-gradient(180deg,#2b8dff,#0a7aff);color:#fff;box-shadow:0 6px 18px rgba(10,122,255,0.32), inset 0 1px 0 rgba(255,255,255,0.25);}\n.btn-primary:active{filter:brightness(0.92);}\n.btn-tinted{background:var(--accent-dim);color:var(--accent);}\n.btn-ghost{background:var(--surface-2);color:var(--text);}\n.btn-danger{background:var(--red-dim);color:var(--red);}\n.btn-sm{padding:12px;font-size:14px;border-radius:14px;box-shadow:none;}\n.btn-row{display:flex;gap:10px;}\n\n/* ── Chart ── */\n.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}\n.chart-title{font-size:13px;font-weight:600;color:var(--text-mid);letter-spacing:0.2px;}\n.chart-wrap{width:100%;position:relative;}\n.legend{display:flex;gap:14px;align-items:center;}\n.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-mid);font-weight:500;}\n.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}\n.empty{color:var(--text-dim);font-size:13px;text-align:center;padding:32px 10px;font-weight:500;}\n\n/* ── Zone matrix ── */\n.matrix-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px;}\n.matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:100%;}\n.matrix th{\n  font-size:10px;font-weight:600;letter-spacing:0.4px;color:var(--text-dim);\n  text-transform:uppercase;padding:6px 4px 10px;white-space:nowrap;text-align:center;\n}\n.matrix th.subj-h{text-align:left;padding-left:2px;position:sticky;left:0;background:var(--surface);z-index:2;}\n.matrix td{padding:5px 4px;text-align:center;}\n.matrix td.subj{\n  text-align:left;font-size:12.5px;color:var(--text);font-weight:500;white-space:nowrap;\n  padding-left:2px;padding-right:12px;position:sticky;left:0;background:var(--surface);z-index:1;\n}\n.dot{\n  display:inline-flex;align-items:center;justify-content:center;\n  width:23px;height:23px;border-radius:8px;font-size:10px;font-weight:700;color:#000;\n}\n.dot.R{background:var(--red);color:#fff;}.dot.Y{background:var(--yellow);color:#3a2f00;}.dot.G{background:var(--green);color:#fff;}\n.dot.none{background:var(--surface-2);color:var(--text-dim);}\n.trend{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;}\n.trend svg{width:15px;height:15px;}\n\n/* ── History ── */\n.hist-item{background:var(--surface);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;transition:background .2s;box-shadow:var(--card-shadow);}\n.hist-head{display:flex;align-items:center;jus     Log Session\n  <\u002Fbutton>\n\n  <div class=\"group-label\">Correct trend<\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"chart-head\"><span class=\"chart-title\">Clean + Flood correct per session<\u002Fspan><\u002Fdiv>\n    <div class=\"chart-wrap\" id=\"execChart\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"group-label\">History<\u002Fdiv>\n  <div id=\"execHistory\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════ WEEKLY SUMMARY ═══════════ -->\n<div class=\"screen\" id=\"s-week\">\n  <div class=\"weeknav\">\n    <button class=\"wbtn\" id=\"weekPrev\" onclick=\"weekStep(-1)\" aria-label=\"Previous week\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n    <div class=\"wlabel\"><div class=\"wt\" id=\"weekTitle\">This Week<\u002Fdiv><div class=\"wd\" id=\"weekDates\"><\u002Fdiv><\u002Fdiv>\n    <button class=\"wbtn\" id=\"weekNext\" onclick=\"weekStep(1)\" aria-label=\"Next week\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"dual\" style=\"margin-bottom:12px\">\n    <div class=\"stat\"><div class=\"v\" id=\"weekAvg\">--<span class=\"u\">/15<\u002Fspan><\u002Fdiv><div class=\"l\">Weekly average<\u002Fdiv><\u002Fdiv>\n    <div class=\"stat\"><div class=\"v c-accent\" id=\"weekAcc\">--<span class=\"u\">%<\u002Fspan><\u002Fdiv><div class=\"l\" id=\"weekTrendLbl\">Accuracy<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"card tight\"><div id=\"weekDays\"><\u002Fdiv><\u002Fdiv>\n  <button class=\"btn btn-primary\" style=\"margin:4px 0\" onclick=\"openDay()\">\n    <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n    Log Day\n  <\u002Fbutton>\n\n  <div class=\"group-label\">Accuracy across weeks<\u002Fdiv>\n  <div class=\"card\">\n    <div class=\"chart-head\"><span class=\"chart-title\">Weekly accuracy<\u002Fspan><\u002Fdiv>\n    <div class=\"chart-wrap\" id=\"weekChart\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══════════ BOTTOM NAV ═══════════ -->\n<nav class=\"nav\">\n  <button class=\"nav-btn active\" id=\"nav-gt\" onclick=\"go('gt')\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><rect x=\"7\" y=\"12\" width=\"3\" height=\"6\" rx=\"1\"><\u002Frect><rect x=\"12.5\" y=\"8\" width=\"3\" height=\"10\" rx=\"1\"><\u002Frect><rect x=\"18\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"><\u002Frect><\u002Fsvg>\n    <span class=\"nl\">GT<\u002Fspan>\n  <\u002Fbutton>\n  <button class=\"nav-btn\" id=\"nav-inst\" onclick=\"go('inst')\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n    <span class=\"nl\">Instinct<\u002Fspan>\n  <\u002Fbutton>\n  <button class=\"nav-btn\" id=\"nav-exec\" onclick=\"go('exec')\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"0.6\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg>\n    <span class=\"nl\">Execution<\u002Fspan>\n  <\u002Fbutton>\n  <button class=\"nav-btn\" id=\"nav-week\" onclick=\"go('week')\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4.5\" width=\"18\" height=\"17\" rx=\"2.5\"><\u002Frect><path d=\"M3 9h18M8 2.5v4M16 2.5v4\"><\u002Fpath><\u002Fsvg>\n    <span class=\"nl\">Weekly<\u002Fspan>\n  <\u002Fbutton>\n<\u002Fnav>\n\n<div class=\"toast\" id=\"toast\"><\u002Fdiv>\n<div class=\"scrim\" id=\"scrim\" onclick=\"closeSheet()\"><\u002Fdiv>\n\n<!-- GT sheet -->\n<div class=\"sheet\" id=\"sheet-gt\">\n  <div class=\"grabber\"><\u002Fdiv>\n  <div class=\"sheet-head\"><h2 id=\"gtSheetTitle\">Log Grand Test<\u002Fh2><button class=\"sheet-close\" onclick=\"closeSheet()\">Cancel<\u002Fbutton><\u002Fdiv>\n  <div class=\"field\"><label>Test name<\u002Flabel><input id=\"f-gtName\" type=\"text\" placeholder=\"e.g. Grand Test 08\" autocomplete=\"off\"><\u002Fdiv>\n  <div class=\"field-row\">\n    <div class=\"field\"><label>Platform<\u002Flabel><input id=\"f-gtPlat\" type=\"text\" placeholder=\"Marrow / PrepLadder\" autocomplete=\"off\"><\u002Fdiv>\n    <div class=\"field\"><label>Date<\u002Flabel><input id=\"f-gtDate\" type=\"date\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field-row-3\">\n    <div class=\"field\"><label>Correct<\u002Flabel><input id=\"f-gtCorrect\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n    <div class=\"field\"><label>Incorrect<\u002Flabel><input id=\"f-gtIncorrect\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n    <div class=\"field\"><label>Skipped<\u002Flabel><input id=\"f-gtSkip\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field-row\">\n    <div class=\"field\"><label>Total score<\u002Flabel><input id=\"f-gtScore\" type=\"number\" inputmode=\"numeric\" placeholder=\"e.g. 612\"><div class=\"hint\">Net marks incl. negative marking.<\u002Fdiv><\u002Fdiv>\n    <div class=\"field\"><label>Percentile<\u002Flabel><input id=\"f-gtPct\" type=\"number\" inputmode=\"decimal\" placeholder=\"e.g. 96.4\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\">\n    <label>Subject zones<\u002Flabel>\n    <div id=\"f-gtZones\"><\u002Fdiv>\n    <div class=\"subj-note\">Any subject left untouched is saved as Yellow.<\u002Fdiv>\n  <\u002Fdiv>\n  <button class=\"btn btn-primary\" onclick=\"saveGT()\">Save grand test<\u002Fbutton>\n  <button class=\"btn btn-danger btn-sm\" id=\"gtDeleteBtn\" style=\"margin-top:10px;display:none\" onclick=\"deleteGT()\">Delete this entry<\u002Fbutton>\n<\u002Fdiv>\n\n<!-- Instinct sheet -->\n<div class=\"sheet\" id=\"sheet-inst\">\n  <div class=\"grabber\"><\u002Fdiv>\n  <div class=\"sheet-head\"><h2 id=\"instSheetTitle\">Log Session<\u002Fh2><button class=\"sheet-close\" onclick=\"closeSheet()\">Cancel<\u002Fbutton><\u002Fdiv>\n  <div class=\"field\"><label>Date<\u002Flabel><input id=\"f-instDate\" type=\"date\"><\u002Fdiv>\n  <div class=\"group-label\" style=\"padding:6px 2px 4px\">Stayed with first instinct<\u002Fdiv>\n  <div class=\"field-row\">\n    <div class=\"field\"><label>Stayed &amp; correct<\u002Flabel><input id=\"f-sC\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n    <div class=\"field\"><label>Stayed &amp; wrong<\u002Flabel><input id=\"f-sI\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"group-label\" style=\"padding:6px 2px 4px\">Changed the answer<\u002Fdiv>\n  <div class=\"field-row\">\n    <div class=\"field\"><label>Changed &amp; correct<\u002Flabel><input id=\"f-cC\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n    <div class=\"field\"><label>Changed &amp; wrong<\u002Flabel><input id=\"f-cI\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hint\" style=\"margin:-2px 0 14px\">Stay total, change total and overall total are computed for you.<\u002Fdiv>\n  <button class=\"btn btn-primary\" onclick=\"saveInst()\">Save session<\u002Fbutton>\n  <button class=\"btn btn-danger btn-sm\" id=\"instDeleteBtn\" style=\"margin-top:10px;display:none\" onclick=\"deleteInst()\">Delete this entry<\u002Fbutton>\n<\u002Fdiv>\n\n<!-- Execution sheet -->\n<div class=\"sheet\" id=\"sheet-exec\">\n  <div class=\"grabber\"><\u002Fdiv>\n  <div class=\"sheet-head\"><h2 id=\"execSheetTitle\">Log Session<\u002Fh2><button class=\"sheet-close\" onclick=\"closeSheet()\">Cancel<\u002Fbutton><\u002Fdiv>\n  <div class=\"field\"><label>Date<\u002Flabel><input id=\"f-execDate\" type=\"date\"><\u002Fdiv>\n  <div class=\"group-label\" style=\"padding:6px 2px 4px\">Clean · reasoned answer<\u002Fdiv>\n  <div class=\"field-row\">\n    <div class=\"field\"><label>Clean &amp; correct<\u002Flabel><input id=\"f-clC\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n    <div class=\"field\"><label>Clean &amp; wrong<\u002Flabel><input id=\"f-clI\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"group-label\" style=\"padding:6px 2px 4px\">Flood · guess or panic<\u002Fdiv>\n  <div class=\"field-row\">\n    <div class=\"field\"><label>Flood &amp; correct<\u002Flabel><input id=\"f-flC\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n    <div class=\"field\"><label>Flood &amp; wrong<\u002Flabel><input id=\"f-flI\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"field\"><label>Skipped<\u002Flabel><input id=\"f-exSkip\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\"><\u002Fdiv>\n  <div class=\"hint\" style=\"margin:-2px 0 14px\">Attempted and total are computed from the counts above.<\u002Fdiv>\n  <button class=\"btn btn-primary\" onclick=\"saveExec()\">Save session<\u002Fbutton>\n  <button class=\"btn btn-danger btn-sm\" id=\"execDeleteBtn\" style=\"margin-top:10px;display:none\" onclick=\"deleteExec()\">Delete this entry<\u002Fbutton>\n<\u002Fdiv>\n\n<!-- Day sheet -->\n<div class=\"sheet\" id=\"sheet-day\">\n  <div class=\"grabber\"><\u002Fdiv>\n  <div class=\"sheet-head\"><h2 id=\"daySheetTitle\">Log Day<\u002Fh2><button class=\"sheet-close\" onclick=\"closeSheet()\">Cancel<\u002Fbutton><\u002Fdiv>\n  <div class=\"field\"><label>Date<\u002Flabel><input id=\"f-dayDate\" type=\"date\"><\u002Fdiv>\n  <div class=\"field\"><label>Topic<\u002Flabel><input id=\"f-dayTopic\" type=\"text\" placeholder=\"e.g. Cardiology\" autocomplete=\"off\"><\u002Fdiv>\n  <div class=\"field\"><label>Score<\u002Flabel><input id=\"f-dayScore\" type=\"number\" inputmode=\"numeric\" placeholder=\"0\" min=\"0\"><div class=\"hint\">Correct answers for this day.<\u002Fdiv><\u002Fdiv>\n  <div class=\"field\"><label>Total Score<\u002Flabel><input id=\"f-dayTotal\" type=\"number\" inputmode=\"numeric\" placeholder=\"15\" value=\"15\" min=\"1\"><\u002Fdiv>\n  <button class=\"btn btn-primary\" onclick=\"saveDay()\">Save day<\u002Fbutton>\n  <button class=\"btn btn-danger btn-sm\" id=\"dayDeleteBtn\" style=\"margin-top:10px;display:none\" onclick=\"deleteDay()\">Delete this entry<\u002Fbutton>\n<\u002Fdiv>\n\n<!-- Settings sheet -->\n<div class=\"sheet\" id=\"sheet-set\">\n  <div class=\"grabber\"><\u002Fdiv>\n  <div class=\"sheet-head\"><h2>Settings<\u002Fh2><button class=\"sheet-close\" onclick=\"closeSheet()\">Done<\u002Fbutton><\u002Fdiv>\n  <div class=\"group-label\" style=\"padding:4px 2px 8px\">Backup<\u002Fdiv>\n  <div class=\"hint\" style=\"margin-bottom:14px\">Export saves every module — grand tests, instinct, execution and weekly — to one file. Restore replaces all current data.<\u002Fdiv>\n  <button class=\"btn btn-tinted\" style=\"margin-bottom:10px\" onclick=\"exportAll()\">\n    <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"><\u002Fpath><\u002Fsvg>\n    Export backup\n  <\u002Fbutton>\n  <button class=\"btn btn-ghost\" onclick=\"triggerRestore()\">\n    <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 9v-4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4M7 14l5-5 5 5M12 9v12\"><\u002Fpath><\u002Fsvg>\n    Restore backup\n  <\u002Fbutton>\n  <input type=\"file\" id=\"restoreInput\" accept=\".json,application/json\" style=\"display:none\" onchange=\"importAll(this)\">\n  <div class=\"group-label\" style=\"padding:20px 2px 8px\">About<\u002Fdiv>\n  <div class=\"hint\">Engram · INICET &amp; NEET&nbsp;PG self-assessment tracker. All data stays on this device.<\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* ═══════════════════ ENGRAM ═══════════════════ */\n'use strict';\n\nvar SUBJECTS = ['Anatomy','Physiology','Biochemistry','Pathology','Pharmacology','Microbiology','Forensic','ENT','Ophthalmology','PSM','Medicine','Surgery','OBGYN','Paediatrics','Dermatology','Radiology','Anaesthesia','Orthopaedics','Psychiatry'];\n\nvar K = {gt:'engram_gt_v1', inst:'engram_inst_v1', exec:'engram_exec_v1', week:'engram_week_v1'};\n\n/* ── storage helpers ── */\nfunction load(k){ try{ return JSON.parse(localStorage.getItem(k) || '[]'); }catch(e){ return []; } }\nfunction save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }\nfunction uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }\n\n/* ── date helpers (Mon–Sun weeks, local) ── */\nfunction today(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }\nfunction p2(n){ return (n<10?'0':'')+n; }\nfunction parseD(s){ var a=(s||'').split('-'); return new Date(+a[0], (+a[1])-1, +a[2]); }\nfunction mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }\nfunction fmtD(d){ var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return m[d.getMonth()]+' '+d.getDate(); }\nfunction weekKey(dateStr){ return mondayOf(parseD(dateStr)).toISOString().slice(0,10); }\nfunction addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }\n\n/* ═══════════ NAV ═══════════ */\nvar TABS=['gt','inst','exec','week'];\nvar TAGS={gt:'GT',inst:'Instinct',exec:'Execution',week:'Weekly'};\nfunction go(tab){\n  TABS.forEach(function(t){\n    document.getElementById('s-'+t).classList.toggle('active', t===tab);\n    document.getElementById('nav-'+t).classList.toggle('active', t===tab);\n  });\n  document.getElementById('brandTag').textContent=TAGS[tab];\n  window.scrollTo(0,0);\n}\n\n/* ═══════════ SHEETS ═══════════ */\nvar activeSheet=null;\nfunction openSheetEl(id){\n  activeSheet=id;\n  document.getElementById('scrim').classList.add('show');\n  var s=document.getElementById(id); s.scrollTop=0; s.classList.add('show');\n}\nfunction closeSheet(){\n  document.getElementById('scrim').classList.remove('show');\n  document.querySelectorAll('.sheet').forEach(function(s){ s.classList.remove('show'); });\n  activeSheet=null;\n}\nfunction toast(msg){\n  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');\n  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); },2000);\n}\n\n/* ═══════════ SVG CHARTS ═══════════ */\nfunction lineChart(el, data, labels, opts){\n  opts=opts||{};\n  var color=opts.color||'#0a7aff', maxY=opts.max||(Math.max.apply(null,data.concat([1]))*1.15), suffix=opts.suffix||'';\n  if(!data.length){ el.innerHTML='<div class=\"empty\">'+(opts.empty||'No data yet')+'<\u002Fdiv>'; return; }\n  var W=el.offsetWidth||320, H=opts.height||130, pad={l:34,r:14,t:18,b:26};\n  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;\n  var n=data.length;\n  var pts=data.map(function(v,i){\n    var x=n>1?pad.l+(i/(n-1))*iw:pad.l+iw/2;\n    var y=pad.t+ih-(Math.max(0,v)/maxY)*ih;\n    return {x:x,y:y,v:v};\n  });\n  var grid='';\n  [0,0.5,1].forEach(function(f){ var y=pad.t+ih*f; grid+='<line x1=\"'+pad.l+'\" y1=\"'+y+'\" x2=\"'+(pad.l+iw)+'\" y2=\"'+y+'\" stroke=\"rgba(60,60,67,0.10)\" stroke-width=\"1\"/>'; });\n  var yl=''; [0,maxY].forEach(function(v,i){ var y=i===0?pad.t+ih:pad.t; yl+='<text x=\"'+(pad.l-6)+'\" y=\"'+(y+3)+'\" text-anchor=\"end\" font-size=\"9\" fill=\"rgba(60,60,67,0.45)\">'+Math.round(v)+'<\u002Ftext>'; });\n  var path=pts.map(function(p,i){ return (i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');\n  var area='M'+pts[0].x.toFixed(1)+','+(pad.t+ih)+' '+pts.map(function(p){return 'L'+p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ')+' L'+pts[n-1].x.toFixed(1)+','+(pad.t+ih)+' Z';\n  var gid='g'+Math.random().toString(36).slice(2,7);\n  var dots=pts.map(function(p){ return '<circle cx=\"'+p.x.toFixed(1)+'\" cy=\"'+p.y.toFixed(1)+'\" r=\"3.5\" fill=\"'+color+'\" stroke=\"#fff\" stroke-width=\"2\"/><text x=\"'+p.x.toFixed(1)+'\" y=\"'+(p.y-8).toFixed(1)+'\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"600\" fill=\"'+color+'\">'+fmtNum(p.v)+suffix+'<\u002Ftext>'; }).join('');\n  var xl=pts.map(function(p,i){ return '<text x=\"'+p.x.toFixed(1)+'\" y=\"'+(pad.t+ih+16)+'\" text-anchor=\"middle\" font-size=\"9\" fill=\"rgba(60,60,67,0.45)\">'+labels[i]+'<\u002Ftext>'; }).join('');\n  el.innerHTML='<svg viewBox=\"0 0 '+W+' '+H+'\" style=\"width:100%;height:'+H+'px;display:block\"><defs><linearGradient id=\"'+gid+'\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"'+color+'\" stop-opacity=\"0.22\"/><stop offset=\"100%\" stop-color=\"'+color+'\" stop-opacity=\"0\"/><\u002FlinearGradient><\u002Fdefs>'+grid+yl+'<path d=\"'+area+'\" fill=\"url(#'+gid+')\"/><path d=\"'+path+'\" fill=\"none\" stroke=\"'+color+'\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>'+dots+xl+'<\u002Fsvg>';\n}\nfunction fmtNum(v){ return (Math.round(v*10)/10).toString(); }\n\nfunction groupedBarChart(el, series, labels, opts){\n  opts=opts||{};\n  if(!series[0].data.length){ el.innerHTML='<div class=\"empty\">'+(opts.empty||'No data yet')+'<\u002Fdiv>'; return; }\n  var W=el.offsetWidth||320, H=opts.height||140, pad={l:30,r:12,t:16,b:26};\n  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;\n  var n=series[0].data.length, groups=series.length;\n  var allv=[]; series.forEach(function(s){ allv=allv.concat(s.data); });\n  var maxY=Math.max.apply(null,allv.concat([1]))*1.18;\n  var slot=iw/n, bw=Math.min(14, (slot*0.62)/groups);\n  var grid=''; [0,0.5,1].forEach(function(f){ var y=pad.t+ih*f; grid+='<line x1=\"'+pad.l+'\" y1=\"'+y+'\" x2=\"'+(pad.l+iw)+'\" y2=\"'+y+'\" stroke=\"rgba(60,60,67,0.10)\"/>'; });\n  var bars='';\n  for(var i=0;i<n;i++){\n    var cx=pad.l+slot*(i+0.5);\n    var start=cx-(groups*bw+ (groups-1)*3)/2;\n    series.forEach(function(s,g){\n      var v=s.data[i], bh=(v/maxY)*ih, x=start+g*(bw+3), y=pad.t+ih-bh;\n      bars+='<rect x=\"'+x.toFixed(1)+'\" y=\"'+y.toFixed(1)+'\" width=\"'+bw.toFixed(1)+'\" height=\"'+Math.max(0,bh).toFixed(1)+'\" rx=\"3\" fill=\"'+s.color+'\"/>';\n      if(groups<=2) bars+='<text x=\"'+(x+bw/2).toFixed(1)+'\" y=\"'+(y-4).toFixed(1)+'\" text-anchor=\"middle\" font-size=\"8.5\" font-weight=\"600\" fill=\"'+s.color+'\">'+v+'<\u002Ftext>';\n    });\n    bars+='<text x=\"'+cx.toFixed(1)+'\" y=\"'+(pad.t+ih+16)+'\" text-anchor=\"middle\" font-size=\"9\" fill=\"rgba(60,60,67,0.45)\">'+labels[i]+'<\u002Ftext>';\n  }\n  el.innerHTML='<svg viewBox=\"0 0 '+W+' '+H+'\" style=\"width:100%;height:'+H+'px;display:block\">'+grid+bars+'<\u002Fsvg>';\n}\n\n/* ═══════════════════ GT TRACKER ═══════════════════ */\nvar gtEditId=null, gtZoneState={};\nfunction getGT(){ return load(K.gt).sort(function(a,b){ return (a.date<b.date?-1:a.date>b.date?1:(a.seq-b.seq)); }); }\n\nfunction openGT(id){\n  gtEditId=id||null; gtZoneState={};\n  document.getElementById('gtSheetTitle').textContent=id?'Edit Grand Test':'Log Grand Test';\n  document.getElementById('gtDeleteBtn').style.display=id?'flex':'none';\n  var g=id?getGT().find(function(x){return x.id===id;}):null;\n  document.getElementById('f-gtName').value=g?g.name:'';\n  document.getElementById('f-gtPlat').value=g?g.platform:'';\n  document.getElementById('f-gtDate').value=g?g.date:today();\n  document.getElementById('f-gtCorrect').value=g?g.correct:'';\n  document.getElementById('f-gtIncorrect').value=g?g.incorrect:'';\n  document.getElementById('f-gtSkip').value=g?g.skip:'';\n  document.getElementById('f-gtScore').value=g&&g.score!=null?g.score:'';\n  document.getElementById('f-gtPct').value=g&&g.percentile!=null?g.percentile:'';\n  if(g&&g.zones) gtZoneState=Object.assign({},g.zones);\n  buildZonePicker();\n  openSheetEl('sheet-gt');\n}\nfunction buildZonePicker(){\n  document.getElementById('f-gtZones').innerHTML=SUBJECTS.map(function(s){\n    var z=gtZoneState[s]||'';\n    return '<div class=\"subj-pick\"><span class=\"sn\">'+s+'<\u002Fspan><div class=\"zbtns\">'+\n      ['R','Y','G'].map(function(zz){ return '<button class=\"zb '+(z===zz?'on-'+zz:'')+'\" onclick=\"pickZone(\\''+s+'\\',\\''+zz+'\\',this)\">'+zz+'<\u002Fbutton>'; }).join('')+\n    '<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\nfunction pickZone(subj,zone,btn){\n  var cur=gtZoneState[subj];\n  gtZoneState[subj]=(cur===zone)?'':zone;\n  var row=btn.parentNode;\n  row.querySelectorAll('.zb').forEach(function(b){ b.className='zb'; });\n  if(gtZoneState[subj]) btn.className='zb on-'+gtZoneState[subj];\n}\nfunction saveGT(){\n  var correct=intval('f-gtCorrect'), incorrect=intval('f-gtIncorrect'), skip=intval('f-gtSkip');\n  var name=document.getElementById('f-gtName').value.trim();\n  var date=document.getElementById('f-gtDate').value||today();\n  var scoreRaw=document.getElementById('f-gtScore').value;\n  var pctRaw=document.getElementById('f-gtPct').value;\n  var zones={};\n  SUBJECTS.forEach(function(s){ zones[s]=gtZoneState[s]||'Y'; }); // untouched -> Yellow\n  var rec={\n    id:gtEditId||uid(), name:name||('Grand Test'), platform:document.getElementById('f-gtPlat').value.trim(),\n    date:date, correct:correct, incorrect:incorrect, skip:skip,\n    score:scoreRaw===''?null:parseFloat(scoreRaw),\n    percentile:pctRaw===''?null:parseFloat(pctRaw),\n    zones:zones, seq:Date.now()\n  };\n  var arr=load(K.gt);\n  if(gtEditId){ var i=arr.findIndex(function(x){return x.id===gtEditId;}); if(i>-1) rec.seq=arr[i].seq, arr[i]=rec; }\n  else arr.push(rec);\n  save(K.gt,arr); closeSheet(); renderGT(); toast(gtEditId?'Grand test updated':'Grand test saved');\n}\nfunction deleteGT(){ if(!confirm('Delete this grand test?'))return; save(K.gt, load(K.gt).filter(function(x){return x.id!==gtEditId;})); closeSheet(); renderGT(); toast('Deleted'); }\n\nfunction renderGT(){\n  var logs=getGT();\n  // stats\n  var sc=document.getElementById('gtStats');\n  if(!logs.length){\n    sc.innerHTML=statCard('--','Total GTs','')+statCard('--','Avg correct','')+statCard('--','Best %ile','c-accent')+statCard('--','Latest %ile','c-green');\n  } else {\n    var avgC=Math.round(logs.reduce(function(s,g){return s+g.correct;},0)/logs.length);\n    var pcts=logs.filter(function(g){return g.percentile!=null;}).map(function(g){return g.percentile;});\n    var bestP=pcts.length?Math.max.apply(null,pcts):null;\n    var lastP=null; for(var i=logs.length-1;i>=0;i--){ if(logs[i].percentile!=null){lastP=logs[i].percentile;break;} }\n    sc.innerHTML=statCard(logs.length,'Total GTs','')+statCard(avgC,'Avg correct','')+\n      statCard(bestP!=null?fmtNum(bestP):'--','Best %ile','c-accent')+statCard(lastP!=null?fmtNum(lastP):'--','Latest %ile','c-green');\n  }\n  var last8=logs.slice(-8), labels=last8.map(function(g,i){return 'GT'+(logs.length-last8.length+i+1);});\n  groupedBarChart(document.getElementById('gtBarChart'),\n    [{data:last8.map(function(g){return g.correct;}),color:'#30c158'},{data:last8.map(function(g){return g.incorrect;}),color:'#ff3b30'}],\n    labels,{empty:'Log a grand test to see correct vs incorrect',height:150});\n  var pctLogs=logs.filter(function(g){return g.percentile!=null;}).slice(-8);\n  lineChart(document.getElementById('gtPctChart'), pctLogs.map(function(g){return g.percentile;}),\n    pctLogs.map(function(g,i){return 'GT'+(i+1);}), {color:'#0a7aff',max:100,empty:'Add percentile values to see the trend',height:130});\n  renderMatrix(logs);\n  renderGTHistory(logs);\n}\nfunction statCard(v,l,cls){ return '<div class=\"stat\"><div class=\"v '+(cls||'')+'\">'+v+'<\u002Fdiv><div class=\"l\">'+l+'<\u002Fdiv><\u002Fdiv>'; }\n\nfunction renderMatrix(logs){\n  var el=document.getElementById('gtMatrix');\n  if(!logs.length){ el.innerHTML='<div class=\"empty\">Subject zones appear after your first GT<\u002Fdiv>'; return; }\n  var cols=logs.slice(-8);\n  var head='<tr><th class=\"subj-h\">Subject<\u002Fth>'+cols.map(function(g,i){return '<th>GT'+(logs.length-cols.length+i+1)+'<\u002Fth>';}).join('')+'<th>Trend<\u002Fth><\u002Ftr>';\n  var rows=SUBJECTS.map(function(s){\n    var cells=cols.map(function(g){ var z=(g.zones&&g.zones[s])||''; return '<td><span class=\"dot '+(z||'none')+'\">'+(z||'&middot;')+'<\u002Fspan><\u002Ftd>'; }).join('');\n    // trend: latest vs immediately previous GT (across full history)\n    var val={R:0,Y:1,G:2};\n    var arrow=trendArrow('flat');\n    if(logs.length>=2){\n      var a=logs[logs.length-1].zones[s], b=logs[logs.length-2].zones[s];\n      if(a&&b){ var d=val[a]-val[b]; arrow=trendArrow(d>0?'up':d<0?'down':'flat'); }\n    }\n    return '<tr><td class=\"subj\">'+s+'<\u002Ftd>'+cells+'<td><span class=\"trend\">'+arrow+'<\u002Fspan><\u002Ftd><\u002Ftr>';\n  }).join('');\n  el.innerHTML='<table class=\"matrix\"><thead>'+head+'<\u002Fthead><tbody>'+rows+'<\u002Ftbody><\u002Ftable>';\n}\nfunction trendArrow(dir){\n  if(dir==='up') return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#30c158\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5M6 11l6-6 6 6\"/><\u002Fsvg>';\n  if(dir==='down') return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#ff3b30\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M6 13l6 6 6-6\"/><\u002Fsvg>';\n  return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"rgba(60,60,67,0.42)\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"/><\u002Fsvg>';\n}\n\nfunction renderGTHistory(logs){\n  var el=document.getElementById('gtHistory');\n  if(!logs.length){ el.innerHTML='<div class=\"card\"><div class=\"empty\">No grand tests logged yet<\u002Fdiv><\u002Fdiv>'; return; }\n  el.innerHTML=logs.slice().reverse().map(function(g,idx){\n    var num=logs.length-idx;\n    var total=g.correct+g.incorrect+g.skip;\n    var zoneChips=SUBJECTS.map(function(s){ var z=g.zones[s]||'Y'; return '<span class=\"mz '+z+'\" title=\"'+s+'\"><b>'+z+'<\u002Fb><small>'+s.slice(0,4)+'<\u002Fsmall><\u002Fspan>'; }).join('');\n    return '<div class=\"hist-item\" id=\"gth-'+g.id+'\">'+\n      '<div class=\"hist-head\" onclick=\"toggleHist(\\''+g.id+'\\')\">'+\n        '<div class=\"hist-main\"><div class=\"hist-title\">'+esc(g.name)+' <span style=\"font-size:12px;color:var(--text-dim);font-weight:600\">GT'+num+'<\u002Fspan><\u002Fdiv>'+\n        '<div class=\"hist-sub\">'+(g.platform?esc(g.platform)+' &middot; ':'')+fmtLong(g.date)+'<\u002Fdiv><\u002Fdiv>'+\n        '<div style=\"text-align:right\"><div class=\"hist-score\">'+g.correct+'<span style=\"font-size:13px;color:var(--text-dim)\">/'+total+'<\u002Fspan><\u002Fdiv>'+\n        (g.percentile!=null?'<div class=\"hist-sub\" style=\"text-align:right\">'+fmtNum(g.percentile)+' %ile<\u002Fdiv>':'')+'<\u002Fdiv>'+\n        '<svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"/><\u002Fsvg>'+\n      '<\u002Fdiv>'+\n      '<div class=\"hist-body\"><div class=\"hist-inner\">'+\n        kv('Correct',g.correct)+kv('Incorrect',g.incorrect)+kv('Skipped',g.skip)+kv('Total questions',total)+\n        kv('Total score',g.score!=null?g.score:'—')+kv('Percentile',g.percentile!=null?fmtNum(g.percentile):'—')+\n        '<div class=\"mini-zones\">'+zoneChips+'<\u002Fdiv>'+\n        '<div class=\"hist-actions\"><button class=\"btn btn-ghost btn-sm\" onclick=\"openGT(\\''+g.id+'\\')\">Edit<\u002Fbutton><\u002Fdiv>'+\n      '<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\nfunction toggleHist(id){ document.getElementById('gth-'+id).classList.toggle('open'); }\nfunction kv(k,v){ return '<div class=\"kv\"><span class=\"k\">'+k+'<\u002Fspan><span class=\"val\">'+v+'<\u002Fspan><\u002Fdiv>'; }\n\n/* ═══════════════════ 1ST INSTINCT ═══════════════════ */\nvar instEditId=null;\nfunction getInst(){ return load(K.inst).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}); }\nfunction openInst(id){\n  instEditId=id||null;\n  document.getElementById('instSheetTitle').textContent=id?'Edit Session':'Log Session';\n  document.getElementById('instDeleteBtn').style.display=id?'flex':'none';\n  var r=id?getInst().find(function(x){return x.id===id;}):null;\n  document.getElementById('f-instDate').value=r?r.date:today();\n  ['sC','sI','cC','cI'].forEach(function(f){ document.getElementById('f-'+f).value=r?r[f]:''; });\n  openSheetEl('sheet-inst');\n}\nfunction saveInst(){\n  var rec={id:instEditId||uid(), date:document.getElementById('f-instDate').value||today(),\n    sC:intval('f-sC'), sI:intval('f-sI'), cC:intval('f-cC'), cI:intval('f-cI')};\n  var arr=load(K.inst);\n  if(instEditId){ var i=arr.findIndex(function(x){return x.id===instEditId;}); if(i>-1) arr[i]=rec; } else arr.push(rec);\n  save(K.inst,arr); closeSheet(); renderInst(); toast(instEditId?'Session updated':'Session saved');\n}\nfunction deleteInst(){ if(!confirm('Delete this session?'))return; save(K.inst, load(K.inst).filter(function(x){return x.id!==instEditId;})); closeSheet(); renderInst(); toast('Deleted'); }\n\nfunction renderInst(){\n  var logs=getInst();\n  var wk=mondayOf(new Date()), wkStr=wk.toISOString().slice(0,10);\n  var week=logs.filter(function(r){ return weekKey(r.date)===wkStr; });\n  document.getElementById('instWeekLabel').textContent=fmtD(wk)+' – '+fmtD(addDays(wk,6));\n  var sC=sum(week,'sC'),sI=sum(week,'sI'),cC=sum(week,'cC'),cI=sum(week,'cI');\n  var S=sC+sI, C=cC+cI, tot=S+C;\n  var stayRate=S?Math.round(sC/S*100):null, changeRate=C?Math.round(cC/C*100):null;\n  document.getElementById('instStayRate').innerHTML=(stayRate!=null?stayRate:'--')+'<span class=\"u\">%<\u002Fspan>';\n  document.getElementById('instChangeRate').innerHTML=(changeRate!=null?changeRate:'--')+'<span class=\"u\">%<\u002Fspan>';\n  // verdict (rate-based)\n  var vd=document.getElementById('instVerdict');\n  if(stayRate==null&&changeRate==null){ vd.innerHTML=verdictBox('neutral',icoInfo(),'No sessions this week','Log a session to compare staying vs changing.'); }\n  else if(changeRate==null){ vd.innerHTML=verdictBox('neutral',icoShield(),'Only stayed answers this week','No changed answers yet to compare against.'); }\n  else if(stayRate==null){ vd.innerHTML=verdictBox('neutral',icoInfo(),'Only changed answers this week','No stayed answers yet to compare against.'); }\n  else if(stayRate>changeRate){ vd.innerHTML=verdictBox('good',icoShield(),'First instinct is winning','Staying is '+(stayRate-changeRate)+' pts more reliable than changing. Protect it.'); }\n  else if(changeRate>stayRate){ vd.innerHTML=verdictBox('bad',icoSwap(),'Changing is paying off','Changing is '+(changeRate-stayRate)+' pts more reliable this week. Trust considered revisions.'); }\n  else { vd.innerHTML=verdictBox('neutral',icoInfo(),'Staying and changing are level','Both convert at '+stayRate+'% this week.'); }\n  // week breakdown\n  document.getElementById('instWeekBreak').innerHTML=\n    '<div class=\"kv\"><span class=\"k\">Stayed (correct / total)<\u002Fspan><span class=\"val\">'+sC+' / '+S+'<\u002Fspan><\u002Fdiv>'+\n    '<div class=\"kv\"><span class=\"k\">Changed (correct / total)<\u002Fspan><span class=\"val\">'+cC+' / '+C+'<\u002Fspan><\u002Fdiv>'+\n    '<div class=\"kv\"><span class=\"k\">Questions reviewed<\u002Fspan><span class=\"val\">'+tot+'<\u002Fspan><\u002Fdiv>';\n  // weekly stay-correct trend (one value stored per week)\n  var byWeek={};\n  logs.forEach(function(r){ var w=weekKey(r.date); byWeek[w]=(byWeek[w]||0)+r.sC; });\n  var weeks=Object.keys(byWeek).sort().slice(-8);\n  lineChart(document.getElementById('instChart'), weeks.map(function(w){return byWeek[w];}),\n    weeks.map(function(w){return fmtD(parseD(w));}), {color:'#30c158',empty:'Weekly stay-correct totals appear here',height:130});\n  renderInstHistory(logs);\n}\nfunction renderInstHistory(logs){\n  var el=document.getElementById('instHistory');\n  if(!logs.length){ el.innerHTML='<div class=\"card\"><div class=\"empty\">No sessions logged yet<\u002Fdiv><\u002Fdiv>'; return; }\n  el.innerHTML=logs.slice().reverse().map(function(r){\n    var S=r.sC+r.sI,C=r.cC+r.cI;\n    var sr=S?Math.round(r.sC/S*100):null, cr=C?Math.round(r.cC/C*100):null;\n    return '<div class=\"hist-item\" id=\"inh-'+r.id+'\"><div class=\"hist-head\" onclick=\"toggleHist2(\\'inh-'+r.id+'\\')\">'+\n      '<div class=\"hist-main\"><div class=\"hist-title\">'+fmtLong(r.date)+'<\u002Fdiv>'+\n      '<div class=\"hist-sub\">Stay '+(sr!=null?sr+'%':'—')+' &middot; Change '+(cr!=null?cr+'%':'—')+'<\u002Fdiv><\u002Fdiv>'+\n      '<svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"/><\u002Fsvg><\u002Fdiv>'+\n      '<div class=\"hist-body\"><div class=\"hist-inner\">'+kv('Stayed &amp; correct',r.sC)+kv('Stayed &amp; wrong',r.sI)+kv('Changed &amp; correct',r.cC)+kv('Changed &amp; wrong',r.cI)+\n      '<div class=\"hist-actions\"><button class=\"btn btn-ghost btn-sm\" onclick=\"openInst(\\''+r.id+'\\')\">Edit<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\nfunction toggleHist2(id){ document.getElementById(id).classList.toggle('open'); }\n\n/* ═══════════════════ EXECUTION ═══════════════════ */\nvar execEditId=null;\nfunction getExec(){ return load(K.exec).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}); }\nfunction openExec(id){\n  execEditId=id||null;\n  document.getElementById('execSheetTitle').textContent=id?'Edit Session':'Log Session';\n  document.getElementById('execDeleteBtn').style.display=id?'flex':'none';\n  var r=id?getExec().find(function(x){return x.id===id;}):null;\n  document.getElementById('f-execDate').value=r?r.date:today();\n  ['clC','clI','flC','flI'].forEach(function(f){ document.getElementById('f-'+f).value=r?r[f]:''; });\n  document.getElementById('f-exSkip').value=r?r.skip:'';\n  openSheetEl('sheet-exec');\n}\nfunction saveExec(){\n  var rec={id:execEditId||uid(), date:document.getElementById('f-execDate').value||today(),\n    clC:intval('f-clC'), clI:intval('f-clI'), flC:intval('f-flC'), flI:intval('f-flI'), skip:intval('f-exSkip')};\n  var arr=load(K.exec);\n  if(execEditId){ var i=arr.findIndex(function(x){return x.id===execEditId;}); if(i>-1) arr[i]=rec; } else arr.push(rec);\n  save(K.exec,arr); closeSheet(); renderExec(); toast(execEditId?'Session updated':'Session saved');\n}\nfunction deleteExec(){ if(!confirm('Delete this session?'))return; save(K.exec, load(K.exec).filter(function(x){return x.id!==execEditId;})); closeSheet(); renderExec(); toast('Deleted'); }\n\nfunction renderExec(){\n  var logs=getExec();\n  var vd=document.getElementById('execVerdict');\n  var sc=document.getElementById('execStats');\n  if(!logs.length){\n    vd.innerHTML=verdictBox('neutral',icoInfo(),'No sessions yet','Log a session to check whether your Clean tagging is trustworthy.');\n    sc.innerHTML=statCard('--','Avg incorrect','c-red')+statCard('--','Clean reliability','c-green')+statCard('--','Flood reliability','c-yellow')+statCard('--','Sessions','');\n    lineChart(document.getElementById('execChart'),[],[],{empty:'Correct trend appears here'});\n    document.getElementById('execHistory').innerHTML='<div class=\"card\"><div class=\"empty\">No sessions logged yet<\u002Fdiv><\u002Fdiv>';\n    return;\n  }\n  var clC=sum(logs,'clC'),clI=sum(logs,'clI'),flC=sum(logs,'flC'),flI=sum(logs,'flI');\n  var clean=clC+clI, flood=flC+flI;\n  var cleanRate=clean?Math.round(clC/clean*100):null, floodRate=flood?Math.round(flC/flood*100):null;\n  var avgIncorrect=Math.round(logs.reduce(function(s,r){return s+r.clI+r.flI;},0)/logs.length*10)/10;\n  // verdict compares clean correct vs clean incorrect (all-time)\n  if(clC>clI) vd.innerHTML=verdictBox('good',icoCheck(),'Tagging is working','When you mark Clean you are right '+(cleanRate!=null?cleanRate+'% ':'')+'of the time. Keep trusting it.');\n  else vd.innerHTML=verdictBox('bad',icoWarn(),'Recalibrate','Your Clean tags miss too often ('+clC+' right vs '+clI+' wrong). Tighten what counts as a reasoned answer.');\n  sc.innerHTML=statCard(avgIncorrect,'Avg incorrect','c-red')+statCard((cleanRate!=null?cleanRate:'--')+'<span class=\"u\">%<\u002Fspan>','Clean reliability','c-green')+\n    statCard((floodRate!=null?floodRate:'--')+'<span class=\"u\">%<\u002Fspan>','Flood reliability','c-yellow')+statCard(logs.length,'Sessions','');\n  var last8=logs.slice(-8);\n  lineChart(document.getElementById('execChart'), last8.map(function(r){return r.clC+r.flC;}),\n    last8.map(function(r){return fmtD(parseD(r.date));}), {color:'#0a7aff',empty:'Correct trend appears here',height:130});\n  renderExecHistory(logs);\n}\nfunction renderExecHistory(logs){\n  var el=document.getElementById('execHistory');\n  el.innerHTML=logs.slice().reverse().map(function(r){\n    var clean=r.clC+r.clI, flood=r.flC+r.flI, att=clean+flood, total=att+r.skip;\n    var cr=clean?Math.round(r.clC/clean*100):null;\n    return '<div class=\"hist-item\" id=\"exh-'+r.id+'\"><div class=\"hist-head\" onclick=\"toggleHist2(\\'exh-'+r.id+'\\')\">'+\n      '<div class=\"hist-main\"><div class=\"hist-title\">'+fmtLong(r.date)+'<\u002Fdiv>'+\n      '<div class=\"hist-sub\">'+(r.clC+r.flC)+' correct &middot; Clean '+(cr!=null?cr+'%':'—')+'<\u002Fdiv><\u002Fdiv>'+\n      '<div style=\"text-align:right\"><div class=\"hist-score\">'+(r.clC+r.flC)+'<span style=\"font-size:13px;color:var(--text-dim)\">/'+att+'<\u002Fspan><\u002Fdiv><\u002Fdiv>'+\n      '<svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"/><\u002Fsvg><\u002Fdiv>'+\n      '<div class=\"hist-body\"><div class=\"hist-inner\">'+kv('Clean correct',r.clC)+kv('Clean wrong',r.clI)+kv('Flood correct',r.flC)+kv('Flood wrong',r.flI)+\n      kv('Attempted',att)+kv('Skipped',r.skip)+kv('Total',total)+\n      '<div class=\"hist-actions\"><button class=\"btn btn-ghost btn-sm\" onclick=\"openExec(\\''+r.id+'\\')\">Edit<\u002Fbutton><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n  }).join('');\n}\n\n/* ═══════════════════ WEEKLY SUMMARY ═══════════════════ */\nvar dayEditId=null, weekOffset=0;\nfunction getDays(){ return load(K.week).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}); }\nfunction openDay(id){\n  dayEditId=id||null;\n  document.getElementById('daySheetTitle').textContent=id?'Edit Day':'Log Day';\n  document.getElementById('dayDeleteBtn').style.display=id?'flex':'none';\n  var r=id?getDays().find(function(x){return x.id===id;}):null;\n  document.getElementById('f-dayDate').value=r?r.date:today();\n  document.getElementById('f-dayTopic').value=r?r.topic:'';\n  document.getElementById('f-dayScore').value=r?r.score:'';\n  document.getElementById('f-dayTotal').value = r ? (r.totalScore || 15) : 15;\n  openSheetEl('sheet-day');\n}\nfunction saveDay(){\n  var total=intval('f-dayTotal');\n  if(!total || total<1) total=15;\n  var sc=Math.max(0,Math.min(total,intval('f-dayScore')));\n  var rec={id:dayEditId||uid(), date:document.getElementById('f-dayDate').value||today(), topic:document.getElementById('f-dayTopic').value.trim()||'Study', score:sc, totalScore:total};\n  var arr=load(K.week);\n  if(dayEditId){ var i=arr.findIndex(function(x){return x.id===dayEditId;}); if(i>-1) arr[i]=rec; } else arr.push(rec);\n  save(K.week,arr); closeSheet(); renderWeek(); toast(dayEditId?'Day updated':'Day saved');\n}\nfunction deleteDay(){ if(!confirm('Delete this day?'))return; save(K.week, load(K.week).filter(function(x){return x.id!==dayEditId;})); closeSheet(); renderWeek(); toast('Deleted'); }\nfunction weekStep(n){ weekOffset+=n; if(weekOffset>0)weekOffset=0; renderWeek(); }\n\nfunction weekAccuracy(days){\n  if(!days.length)return null;\n  var total=days.reduce(function(s,d){return s+(d.totalScore||15);},0);\n  if(!total)return null;\n  return days.reduce(function(s,d){return s+d.score;},0)/total*100;\n}\n\nfunction renderWeek(){\n  var all=getDays();\n  var base=mondayOf(addDays(new Date(), weekOffset*7));\n  var baseStr=base.toISOString().slice(0,10);\n  var days=all.filter(function(d){ return weekKey(d.date)===baseStr; });\n  document.getElementById('weekTitle').textContent=weekOffset===0?'This Week':(weekOffset===-1?'Last Week':(-weekOffset)+' weeks ago');\n  document.getElementById('weekDates').textContent=fmtD(base)+' – '+fmtD(addDays(base,6));\n  document.getElementById('weekNext').disabled=(weekOffset>=0);\n  document.getElementById('weekPrev').disabled=false;\n  // stats\n  var avg=days.length?days.reduce(function(s,d){return s+d.score;},0)/days.length:null;\n  var avgTotal=days.length?days.reduce(function(s,d){return s+(d.totalScore||15);},0)/days.length:null;\n  var acc=weekAccuracy(days);\n  document.getElementById('weekAvg').innerHTML=(avg!=null?fmtNum(avg):'--')+'<span class=\"u\">/'+(avgTotal!=null?fmtNum(avgTotal):'--')+'<\u002Fspan>';\n  document.getElementById('weekAcc').innerHTML=(acc!=null?Math.round(acc):'--')+'<span class=\"u\">%<\u002Fspan>';\n  // trend vs previous week\n  var prevStr=mondayOf(addDays(base,-7)).toISOString().slice(0,10);\n  var prevDays=all.filter(function(d){return weekKey(d.date)===prevStr;});\n  var prevAcc=weekAccuracy(prevDays);\n  var tl=document.getElementById('weekTrendLbl');\n  if(acc!=null&&prevAcc!=null){\n    if(acc>prevAcc+0.5) tl.innerHTML='Accuracy &middot; <span class=\"c-green\">&#8593; up<\u002Fspan>';\n    else if(acc<prevAcc-0.5) tl.innerHTML='Accuracy &middot; <span class=\"c-red\">&#8595; down<\u002Fspan>';\n    else tl.innerHTML='Accuracy &middot; <span class=\"c-mid\">&#8596; steady<\u002Fspan>';\n  } else tl.textContent='Accuracy';\n  // days list (Mon..Sun)\n  var wd=document.getElementById('weekDays');\n  var names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\n  var html='';\n  for(var i=0;i<7;i++){\n    var dd=addDays(base,i), ds=dd.getFullYear()+'-'+p2(dd.getMonth()+1)+'-'+p2(dd.getDate());\n    var rec=days.find(function(d){return d.date===ds;});\n    if(rec){\n      html+='<div class=\"day-row\"><div class=\"dnum\">'+names[i]+'<\u002Fdiv>'+\n        '<div class=\"dtopic\"><div class=\"dt\">'+esc(rec.topic)+'<\u002Fdiv><div class=\"dday\">'+fmtD(dd)+'<\u002Fdiv><\u002Fdiv>'+\n        '<div class=\"dscore\">'+rec.score+'<small>/'+(rec.totalScore||15)+'<\u002Fsmall><\u002Fdiv>'+\n        '<div class=\"dact\"><button class=\"icon-btn\" onclick=\"openDay(\\''+rec.id+'\\')\" aria-label=\"Edit\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/><\u002Fsvg><\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n    } else {\n      html+='<div class=\"day-row\" onclick=\"quickDay(\\''+ds+'\\')\" style=\"opacity:.55\"><div class=\"dnum\">'+names[i]+'<\u002Fdiv>'+\n        '<div class=\"dtopic\"><div class=\"dt\" style=\"color:var(--text-dim);font-weight:500\">Not logged<\u002Fdiv><div class=\"dday\">'+fmtD(dd)+'<\u002Fdiv><\u002Fdiv>'+\n        '<div class=\"dscore\" style=\"color:var(--text-dim)\">&ndash;<\u002Fdiv><div class=\"dact\"><\u002Fdiv><\u002Fdiv>';\n    }\n  }\n  wd.innerHTML=html;\n  // weekly accuracy chart across weeks\n  var byWeek={};\n  all.forEach(function(d){ var w=weekKey(d.date), b=byWeek[w]||(byWeek[w]={score:0,total:0}); b.score+=d.score; b.total+=(d.totalScore||15); });\n  var weeks=Object.keys(byWeek).sort().slice(-8);\n  lineChart(document.getElementById('weekChart'),\n    weeks.map(function(w){ var a=byWeek[w]; return a.total?Math.round(a.score/a.total*100):0; }),\n    weeks.map(function(w){return fmtD(parseD(w));}),\n    {color:'#0a7aff',max:100,suffix:'',empty:'Weekly accuracy appears here',height:130});\n}\nfunction quickDay(ds){ openDay(); document.getElementById('f-dayDate').value=ds; }\n\n/* ═══════════ shared UI bits ═══════════ */\nfunction verdictBox(cls,ico,title,sub){ return '<div class=\"verdict '+cls+'\"><span class=\"vi\">'+ico+'<\u002Fspan><span class=\"vt\">'+title+'<small>'+sub+'<\u002Fsmall><\u002Fspan><\u002Fdiv>'; }\nfunction icoShield(){ return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/><path d=\"M9 12l2 2 4-4\"/><\u002Fsvg>'; }\nfunction icoSwap(){ return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 3l4 4-4 4M21 7H7M7 21l-4-4 4-4M3 17h14\"/><\u002Fsvg>'; }\nfunction icoCheck(){ return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12l3 3 5-6\"/><\u002Fsvg>'; }\nfunction icoWarn(){ return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/><path d=\"M12 9v4M12 17h.01\"/><\u002Fsvg>'; }\nfunction icoInfo(){ return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 16v-4M12 8h.01\"/><\u002Fsvg>'; }\n\nfunction intval(id){ var v=parseInt(document.getElementById(id).value,10); return isNaN(v)?0:v; }\nfunction sum(arr,f){ return arr.reduce(function(s,r){return s+(r[f]||0);},0); }\nfunction esc(s){ return (s||'').replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c];}); }\nfunction fmtLong(ds){ var d=parseD(ds); var m=['January','February','March','April','May','June','July','August','September','October','November','December']; return d.getDate()+' '+m[d.getMonth()].slice(0,3)+' '+d.getFullYear(); }\n\n/* ═══════════ SETTINGS / BACKUP (whole app) ═══════════ */\nfunction openSettings(){ openSheetEl('sheet-set'); }\nvar BACKUP_VERSION=1;\nfunction buildBackup(){\n  return JSON.stringify({app:'ENGRAM', version:BACKUP_VERSION, exportedAt:new Date().toISOString(),\n    data:{ gt:load(K.gt), inst:load(K.inst), exec:load(K.exec), week:load(K.week) }}, null, 2);\n}\nfunction exportAll(){\n  var json=buildBackup();\n  var name='ENGRAM_Backup_'+today()+'.json';\n  // Android bridge if present, else browser download\n  if(window.Android && typeof window.Android.saveFile==='function'){\n    window.Android.saveFile(json, name); toast('Backup exported');\n  } else {\n    var blob=new Blob([json],{type:'application/json'});\n    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    setTimeout(function(){URL.revokeObjectURL(a.href);},1000); toast('Backup exported');\n  }\n}\nfunction triggerRestore(){ document.getElementById('restoreInput').click(); }\nfunction importAll(input){\n  var file=input.files&&input.files[0]; if(!file){return;}\n  var reader=new FileReader();\n  reader.onload=function(e){ applyBackup(e.target.result); input.value=''; };\n  reader.readAsText(file);\n}\n// Called by Android bridge (file chosen natively) or by importAll\nfunction handleAndroidRestore(jsonStr){ applyBackup(jsonStr); }\nfunction applyBackup(jsonStr){\n  var obj; try{ obj=JSON.parse(jsonStr); }catch(e){ toast('Invalid backup file'); return; }\n  var d=obj&&obj.data?obj.data:obj;\n  if(!d || (!d.gt&&!d.inst&&!d.exec&&!d.week)){ toast('Unrecognised backup'); return; }\n  if(!confirm('Replace ALL current data with this backup? This cannot be undone.')) return;\n  if(d.gt) save(K.gt,d.gt); if(d.inst) save(K.inst,d.inst);\n  if(d.exec) save(K.exec,d.exec); if(d.week) save(K.week,d.week);\n  closeSheet(); renderAll(); toast('Backup restored');\n}\n\n/* ═══════════ INIT ═══════════ */\nfunction renderAll(){ renderGT(); renderInst(); renderExec(); renderWeek(); }\nwindow.addEventListener('resize', function(){ clearTimeout(window._rz); window._rz=setTimeout(renderAll,180); });\ndocument.addEventListener('DOMContentLoaded', function(){ renderAll(); });\nrenderAll();\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
