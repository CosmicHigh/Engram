name: Apply smooth tab switching fix

on:
  push:
    branches:
      - codex/material-you-premium-polish

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out premium branch
        uses: actions/checkout@v4
        with:
          ref: codex/material-you-premium-polish
          fetch-depth: 0

      - name: Apply tab smoothing fix
        run: python3 scripts/apply_tab_smooth_fix.py

      - name: Validate standalone bundle
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path('app/src/main/assets/engram.html').read_text(encoding='utf-8')
          required = [
              'engram-tab-smooth-v6',
              'function replayCharts()',
              'chart replays during tab switches caused frame drops',
              '@media(hover:none)',
              'f-dayTotal',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f'Missing tab-smoothing tokens: {missing}')
          forbidden = [
              "screen.classList.add('m3-tab-entering')",
              'replayCharts(screen)',
          ]
          present = [token for token in forbidden if token in html]
          if present:
              raise SystemExit(f'Premium tab replay remains: {present}')

          pattern = re.compile(
              r'materialScript\.textContent\s*=\s*'
              r'("(?:\\.|[^"\\])*")\s*;'
          )
          match = pattern.search(html)
          if not match:
              raise SystemExit('Could not extract material script')
          script = json.loads(match.group(1))
          Path('/tmp/engram-tab-smooth.js').write_text(script, encoding='utf-8')
          print(f'Validated standalone HTML: {len(html):,} characters')
          PY
          node --check /tmp/engram-tab-smooth.js
          git diff --check

      - name: Commit smooth standalone HTML
        run: |
          if git diff --quiet -- app/src/main/assets/engram.html; then
            echo 'engram.html already includes the tab smoothing fix.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/engram.html
          git commit -m 'Restore smooth Material tab switching'
          git push origin HEAD:codex/material-you-premium-polish
