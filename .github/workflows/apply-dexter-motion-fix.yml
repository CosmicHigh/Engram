name: Apply Dexter-style motion architecture

on:
  push:
    branches:
      - codex/material-you-premium-polish

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out premium branch
        uses: actions/checkout@v4
        with:
          ref: codex/material-you-premium-polish
          fetch-depth: 0

      - name: Run patch and capture diagnostics
        id: patch
        shell: bash
        run: |
          set +e
          python3 scripts/apply_dexter_motion_fix.py > /tmp/dexter-motion-run.txt 2>&1
          code=$?
          set -e
          mkdir -p analysis
          cp /tmp/dexter-motion-run.txt analysis/dexter-motion-run.txt
          printf '\nEXIT_CODE=%s\n' "$code" >> analysis/dexter-motion-run.txt
          cat analysis/dexter-motion-run.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Commit diagnostics or generated HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/dexter-motion-run.txt
          if [ "${{ steps.patch.outputs.exit_code }}" = "0" ]; then
            git add app/src/main/assets/engram.html
          fi
          git commit -m 'Capture Dexter motion bundle result'
          git push origin HEAD:codex/material-you-premium-polish

      - name: Fail when patch failed
        if: steps.patch.outputs.exit_code != '0'
        run: exit 1
