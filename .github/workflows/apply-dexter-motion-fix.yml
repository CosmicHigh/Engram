name: Inspect remaining motion observers

on:
  push:
    branches:
      - codex/material-you-premium-polish

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/material-you-premium-polish
          fetch-depth: 0

      - name: Extract observer contexts
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path('app/src/main/assets/engram.html').read_text(encoding='utf-8')
          pattern = re.compile(
              r'materialScript\.textContent\s*=\s*'
              r'("(?:\\.|[^"\\])*")\s*;'
          )
          match = pattern.search(html)
          if not match:
              raise SystemExit('Could not extract material script')
          js = json.loads(match.group(1))

          lines = js.splitlines()
          hits = []
          for index, line in enumerate(lines):
              if 'new MutationObserver' in line or "attributeFilter: ['class']" in line or 'attributes: true' in line:
                  hits.append(index)

          selected = set()
          for index in hits:
              selected.update(range(max(0, index - 12), min(len(lines), index + 18)))

          out = []
          previous = -2
          for index in sorted(selected):
              if index > previous + 1:
                  out.append('---')
              out.append(f'{index + 1:04d}: {lines[index]}')
              previous = index

          out.append('---')
          out.append(f'MutationObservers: {js.count("new MutationObserver")}')
          out.append(f'Class observers: {js.count("attributeFilter: [\'class\']")}')
          Path('analysis/motion-observer-context.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('\n'.join(out))
          PY

      - name: Commit observer context
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/motion-observer-context.txt
          git commit -m 'Inspect remaining motion observers'
          git push origin HEAD:codex/material-you-premium-polish
