name: Apply Dexter-style motion architecture

on:
  push:
    branches:
      - codex/material-you-premium-polish

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out premium branch
        uses: actions/checkout@v4
        with:
          ref: codex/material-you-premium-polish
          fetch-depth: 0

      - name: Apply Dexter motion model
        run: python3 scripts/apply_dexter_motion_fix.py

      - name: Validate standalone bundle
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path('app/src/main/assets/engram.html').read_text(encoding='utf-8')
          required = [
              'engram-dexter-motion-v7',
              'm3DexterScreenIn',
              'the screen enters as one unit',
              'f-dayTotal',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f'Missing Dexter motion tokens: {missing}')

          forbidden = [
              'new IntersectionObserver',
              "rootMargin: '120px 0px 220px 0px'",
              'engram-scroll-smooth-v5',
              "screen.classList.add('m3-tab-entering')",
              'replayCharts(screen)',
              'attributeOldValue: true',
          ]
          present = [token for token in forbidden if token in html]
          if present:
              raise SystemExit(f'Heavy motion orchestration remains: {present}')

          def extract(name):
              pattern = re.compile(
                  rf'{name}\.textContent\s*=\s*'
                  r'("(?:\\.|[^"\\])*")\s*;'
              )
              match = pattern.search(html)
              if not match:
                  raise SystemExit(f'Could not extract {name}')
              return json.loads(match.group(1))

          css = extract('materialStyle')
          js = extract('materialScript')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS braces are unbalanced')
          if css.count('engram-dexter-motion-v7') != 1:
              raise SystemExit('Dexter CSS patch was embedded more than once')
          if js.count('new IntersectionObserver'):
              raise SystemExit('IntersectionObserver still exists in material script')
          Path('/tmp/engram-dexter-motion.js').write_text(js, encoding='utf-8')
          print(f'Validated standalone HTML: {len(html):,} characters')
          print(f'MutationObservers retained: {js.count("new MutationObserver")}')
          PY
          node --check /tmp/engram-dexter-motion.js
          git diff --check

      - name: Commit standalone HTML
        run: |
          if git diff --quiet -- app/src/main/assets/engram.html; then
            echo 'engram.html already uses the Dexter motion model.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/engram.html
          git commit -m 'Adopt Dexter-style lightweight motion architecture'
          git push origin HEAD:codex/material-you-premium-polish
