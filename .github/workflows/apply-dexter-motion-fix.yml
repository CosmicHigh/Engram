name: Validate Dexter-style motion architecture

on:
  push:
    branches:
      - codex/material-you-premium-polish

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out premium branch
        uses: actions/checkout@v4
        with:
          ref: codex/material-you-premium-polish
          fetch-depth: 0

      - name: Extract and audit standalone bundle
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html_path = Path('app/src/main/assets/engram.html')
          html = html_path.read_text(encoding='utf-8')

          def extract(name):
              pattern = re.compile(
                  rf'{name}\.textContent\s*=\s*'
                  r'("(?:\\.|[^"\\])*")\s*;'
              )
              match = pattern.search(html)
              if not match:
                  raise SystemExit(f'Could not extract {name}')
              return json.loads(match.group(1))

          css = extract('materialStyle')
          js = extract('materialScript')

          required = [
              'engram-material-inline-v1',
              'engram-playful-hero-v2',
              'engram-premium-polish-v3',
              'engram-premium-stability-v4',
              'engram-dexter-motion-v7',
              'm3DexterScreenIn',
              'the screen enters as one unit',
              'f-dayTotal',
          ]
          forbidden = [
              'new IntersectionObserver',
              "rootMargin: '120px 0px 220px 0px'",
              'engram-scroll-smooth-v5',
              'engram-tab-smooth-v6',
              "screen.classList.add('m3-tab-entering')",
              'replayCharts(screen)',
              'attributeOldValue: true',
          ]

          missing = [token for token in required if token not in html]
          present = [token for token in forbidden if token in html]
          if missing:
              raise SystemExit(f'Missing required tokens: {missing}')
          if present:
              raise SystemExit(f'Heavy motion orchestration remains: {present}')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS braces are unbalanced')
          if css.count('engram-dexter-motion-v7') != 1:
              raise SystemExit('Dexter motion layer was embedded more than once')

          Path('/tmp/engram-material.js').write_text(js, encoding='utf-8')
          report = [
              'Dexter motion validation: PASS',
              f'HTML bytes: {html_path.stat().st_size}',
              f'CSS characters: {len(css)}',
              f'JavaScript characters: {len(js)}',
              f'MutationObservers retained: {js.count("new MutationObserver")}',
              f'IntersectionObservers retained: {js.count("new IntersectionObserver")}',
              f'Class-attribute observers retained: {js.count("attributeFilter: [\\\'class\\\']")}',
              'Screen transition: opacity + translate3d only',
              'Scroll reveal observer: removed',
              'Tab hero/chart replay: removed',
              'Continuous premium decoration: disabled',
          ]
          Path('analysis/dexter-motion-validation.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY
          node --check /tmp/engram-material.js
          git diff --check

      - name: Commit validation report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/dexter-motion-validation.txt
          git commit -m 'Validate Dexter-style motion bundle'
          git push origin HEAD:codex/material-you-premium-polish
