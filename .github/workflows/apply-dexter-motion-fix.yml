name: Apply final Dexter motion observer fix

on:
  push:
    branches:
      - codex/material-you-premium-polish

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/material-you-premium-polish
          fetch-depth: 0

      - name: Remove final class observer
        run: python3 scripts/apply_final_observer_fix.py

      - name: Validate standalone bundle
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html_path = Path('app/src/main/assets/engram.html')
          html = html_path.read_text(encoding='utf-8')

          def extract(name):
              pattern = re.compile(
                  rf'{name}\.textContent\s*=\s*'
                  r'("(?:\\.|[^"\\])*")\s*;'
              )
              match = pattern.search(html)
              if not match:
                  raise SystemExit(f'Could not extract {name}')
              return json.loads(match.group(1))

          css = extract('materialStyle')
          js = extract('materialScript')

          required = [
              'engram-dexter-motion-v7',
              'engram-dexter-observer-v8',
              'm3DexterScreenIn',
              'f-dayTotal',
          ]
          forbidden = [
              'new IntersectionObserver',
              "attributeFilter: ['class']",
              'refreshTab = false',
              'engram-scroll-smooth-v5',
              'engram-tab-smooth-v6',
              "screen.classList.add('m3-tab-entering')",
              'replayCharts(screen)',
          ]

          missing = [token for token in required if token not in html]
          present = [token for token in forbidden if token in html]
          if missing:
              raise SystemExit(f'Missing required tokens: {missing}')
          if present:
              raise SystemExit(f'Heavy navigation motion remains: {present}')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS braces are unbalanced')

          mutation_count = js.count('new MutationObserver')
          intersection_count = js.count('new IntersectionObserver')
          class_observer_count = js.count("attributeFilter: ['class']")

          Path('/tmp/engram-final-motion.js').write_text(js, encoding='utf-8')
          report = [
              'Final Dexter motion validation: PASS',
              f'HTML bytes: {html_path.stat().st_size}',
              f'MutationObserver declarations retained: {mutation_count}',
              f'IntersectionObserver declarations retained: {intersection_count}',
              f'Class-attribute observers retained: {class_observer_count}',
              'Tab transition: one screen-level opacity/translate3d animation',
              'Navigation: indicator and color transitions only',
              'Hero decoration: static',
              'Charts on tab switch: static',
              'Explicit action feedback: retained',
          ]
          Path('analysis/final-motion-validation.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY
          node --check /tmp/engram-final-motion.js
          git diff --check

      - name: Commit generated HTML and validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/engram.html analysis/final-motion-validation.txt
          git commit -m 'Remove final tab class observer'
          git push origin HEAD:codex/material-you-premium-polish
