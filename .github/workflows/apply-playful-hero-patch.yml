name: Apply playful hero patch

on:
  push:
    branches:
      - codex/material-you-3-redesign

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: codex/material-you-3-redesign
          fetch-depth: 0

      - name: Embed stronger motion and hero cards
        run: python3 scripts/apply_playful_hero_patch.py

      - name: Validate the standalone bundle
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path('app/src/main/assets/engram.html').read_text(encoding='utf-8')
          required = [
              'engram-material-inline-v1',
              'engram-playful-hero-v2',
              'm3-hero-card',
              'm3HeroLand',
              '__engramPlayfulHeroV2',
              'f-dayTotal',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f'Missing standalone tokens: {missing}')

          def assignment(name):
              pattern = re.compile(
                  rf'{name}\.textContent\s*=\s*'
                  r'("(?:\\.|[^"\\])*")\s*;'
              )
              match = pattern.search(html)
              if not match:
                  raise SystemExit(f'Could not extract {name}')
              return json.loads(match.group(1))

          css = assignment('materialStyle')
          js = assignment('materialScript')
          Path('/tmp/material-playful.js').write_text(js, encoding='utf-8')

          if css.count('{') != css.count('}'):
              raise SystemExit('CSS braces are unbalanced')
          if js.count('engram-playful-hero-v2') != 1:
              raise SystemExit('Playful JavaScript patch was embedded more than once')
          print(f'Validated standalone HTML: {len(html):,} characters')
          PY
          node --check /tmp/material-playful.js
          git diff --check

      - name: Commit generated HTML
        run: |
          if git diff --quiet -- app/src/main/assets/engram.html; then
            echo 'engram.html already includes the playful hero patch.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/engram.html
          git commit -m 'Make hero metrics colorful and motion more playful'
          git push origin HEAD:codex/material-you-3-redesign
