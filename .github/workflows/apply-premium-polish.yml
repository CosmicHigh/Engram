name: Apply premium Material polish

on:
  push:
    branches:
      - codex/material-you-premium-polish

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out premium branch
        uses: actions/checkout@v4
        with:
          ref: codex/material-you-premium-polish
          fetch-depth: 0

      - name: Inline premium polish
        run: python3 scripts/apply_premium_polish.py

      - name: Validate standalone bundle
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          html = Path('app/src/main/assets/engram.html').read_text(encoding='utf-8')
          required = [
              'engram-material-inline-v1',
              'engram-playful-hero-v2',
              'engram-premium-polish-v3',
              'm3-premium-card',
              'm3-chart-premium',
              '__engramPremiumPolishV3',
              'f-dayTotal',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f'Missing standalone tokens: {missing}')

          def assignment(name):
              pattern = re.compile(
                  rf'{name}\.textContent\s*=\s*'
                  r'("(?:\\.|[^"\\])*")\s*;'
              )
              match = pattern.search(html)
              if not match:
                  raise SystemExit(f'Could not extract {name}')
              return json.loads(match.group(1))

          css = assignment('materialStyle')
          js = assignment('materialScript')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS braces are unbalanced')
          if js.count('engram-premium-polish-v3') != 1:
              raise SystemExit('Premium JavaScript was embedded more than once')
          Path('/tmp/engram-material.js').write_text(js, encoding='utf-8')
          print(f'Validated standalone HTML: {len(html):,} characters')
          PY
          node --check /tmp/engram-material.js
          git diff --check

      - name: Commit standalone HTML
        run: |
          if git diff --quiet -- app/src/main/assets/engram.html; then
            echo 'engram.html already includes the premium polish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/engram.html
          git commit -m 'Add premium Material motion and chart polish'
          git push origin HEAD:codex/material-you-premium-polish
